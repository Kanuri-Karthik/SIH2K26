<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Saffron / Radiant Gold (Vigilance & Sovereign Energy) -->
    <linearGradient id="jd-saffron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="50%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Emerald Green (Grassroots Public Development & Integrity) -->
    <linearGradient id="jd-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Tech Azure / AI Radar Glow -->
    <linearGradient id="jd-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Iris Deep Navy Fill -->
    <linearGradient id="jd-iris-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4377" />
      <stop offset="100%" stop-color="#06223F" />
    </linearGradient>

    <!-- Satellite Orbit Gradient -->
    <linearGradient id="jd-orbit-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#FCD34D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3" />
    </linearGradient>

    <filter id="jd-subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background Badge (Clean Squircle container with sovereign deep navy) -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="#082746" stroke="#1E4D7B" stroke-width="1.5" />
  <rect x="5" y="5" width="90" height="90" rx="19" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.3" />

  <!-- 2. Satellite Orbit / GNN Radar Ellipse -->
  <ellipse 
    cx="50" 
    cy="50" 
    rx="37" 
    ry="16" 
    transform="rotate(-24 50 50)" 
    fill="none" 
    stroke="url(#jd-orbit-grad)" 
    stroke-width="1.8" 
    stroke-dasharray="5 3 2 3" 
  />

  <!-- Orbiting Telemetry Satellite Node -->
  <g transform="translate(80, 36) rotate(-24)">
    <circle cx="0" cy="0" r="2.8" fill="#FCD34D" filter="url(#jd-subtle-glow)" />
    <circle cx="0" cy="0" r="5" fill="none" stroke="#FCD34D" stroke-width="1" stroke-opacity="0.5" />
  </g>

  <!-- Ground Pulse Node -->
  <circle cx="21" cy="63" r="2" fill="#38BDF8" />

  <!-- 3. DRISHTI (The Vigilant Sovereign Eye Arcs) -->
  <!-- Upper Eyelid / Saffron Sweep (Vigilance & Sunshine) -->
  <path 
    d="M 16 50 C 28 27 72 27 84 50" 
    fill="none" 
    stroke="url(#jd-saffron)" 
    stroke-width="5.5" 
    stroke-linecap="round" 
  />

  <!-- Lower Eyelid / Green Sweep (Grassroots & Public Development) -->
  <path 
    d="M 16 50 C 28 73 72 73 84 50" 
    fill="none" 
    stroke="url(#jd-green)" 
    stroke-width="5.5" 
    stroke-linecap="round" 
  />

  <!-- 4. Eye Inner Lens Area -->
  <circle cx="50" cy="50" r="19" fill="url(#jd-iris-bg)" stroke="#0284C7" stroke-width="1.8" />
  
  <!-- AI Radar Ring -->
  <circle cx="50" cy="50" r="15" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2.5 2.5" opacity="0.8" />

  <!-- 5. JAN (The People / Citizen Silhouette at the Center of Drishti) -->
  <!-- Central Citizen -->
  <circle cx="50" cy="42" r="3.4" fill="#FFFFFF" />
  <path d="M 43.5 56.5 C 43.5 49 46 47 50 47 C 54 47 56.5 49 56.5 56.5 Z" fill="#FFFFFF" />

  <!-- Community Left Silhouette (Amber/Gold Accent) -->
  <circle cx="39" cy="45" r="2.4" fill="#FCD34D" />
  <path d="M 34.5 56 C 34.5 50.5 36.5 49 39 49 C 41.5 49 43 50.5 43 56 Z" fill="#FCD34D" opacity="0.9" />

  <!-- Community Right Silhouette (Green/Teal Accent) -->
  <circle cx="61" cy="45" r="2.4" fill="#6EE7B7" />
  <path d="M 57 56 C 57 50.5 58.5 49 61 49 C 63.5 49 65.5 50.5 65.5 56 Z" fill="#6EE7B7" opacity="0.9" />

  <!-- Grounding Horizon Bar -->
  <path d="M 33 57.5 L 67 57.5" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" />

  <!-- 6. Apex Sovereign Crown Indicator (Subtle 3-dot Government Emblem Accent) -->
  <circle cx="45" cy="18" r="1.5" fill="#FF9933" />
  <circle cx="50" cy="16" r="2" fill="#FCD34D" />
  <circle cx="55" cy="18" r="1.5" fill="#FF9933" />
</svg>
