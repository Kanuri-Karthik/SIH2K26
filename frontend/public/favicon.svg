<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fav-saffron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="fav-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="fav-iris" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4377" />
      <stop offset="100%" stop-color="#06223F" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="#082746" stroke="#F59E0B" stroke-width="2" />

  <!-- Orbit -->
  <ellipse cx="50" cy="50" rx="36" ry="16" transform="rotate(-24 50 50)" fill="none" stroke="#FCD34D" stroke-width="2" stroke-dasharray="6 3" />
  <circle cx="79" cy="37" r="3" fill="#FCD34D" />

  <!-- Eye Arcs -->
  <path d="M 16 50 C 28 27 72 27 84 50" fill="none" stroke="url(#fav-saffron)" stroke-width="6" stroke-linecap="round" />
  <path d="M 16 50 C 28 73 72 73 84 50" fill="none" stroke="url(#fav-green)" stroke-width="6" stroke-linecap="round" />

  <!-- Iris -->
  <circle cx="50" cy="50" r="18" fill="url(#fav-iris)" stroke="#0284C7" stroke-width="2" />
  
  <!-- Citizen at core -->
  <circle cx="50" cy="42" r="3.6" fill="#FFFFFF" />
  <path d="M 43.5 56 C 43.5 49 46 47 50 47 C 54 47 56.5 49 56.5 56 Z" fill="#FFFFFF" />
  <circle cx="39" cy="45" r="2.5" fill="#FCD34D" />
  <circle cx="61" cy="45" r="2.5" fill="#6EE7B7" />
</svg>